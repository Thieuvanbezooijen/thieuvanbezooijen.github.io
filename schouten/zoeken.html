<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zoeken | sgdentalshop.com mockup</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-header"></div>
  <main class="page cat-page">
    <div class="wrap">
      <h1>Zoekresultaten</h1>
      <p class="lead">Zoekterm: <strong id="q"></strong></p>
      <div class="showcase" id="grid"></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/site.js"></script>
  <script>
    pageInit = function () {
      const q = (new URLSearchParams(location.search).get("q") || "").toLowerCase();
      document.getElementById("q").textContent = q || "(leeg)";
      const hits = q
        ? PRODUCTS.filter((p) =>
            [p.name, p.brand, p.tag, p.blurb].join(" ").toLowerCase().includes(q)
          )
        : PRODUCTS;
      renderShowcase(document.getElementById("grid"), hits);
    };
  </script>
</body>
</html>
