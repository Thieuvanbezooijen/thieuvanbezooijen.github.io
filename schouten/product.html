<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product | sgdentalshop.com</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-header"></div>
  <main class="page cat-page">
    <div class="wrap">
      <div class="crumbs"><a href="index.html">Home</a> / <a id="crumbCat" href="categorie.html">Categorie</a> / <span id="crumbName">Product</span></div>

      <article class="pdp">
        <div class="pdp-visual show-visual" id="pVisual" aria-hidden="true"></div>
        <div class="pdp-meta">
          <span class="show-brand" id="pBrand"></span>
          <h1 id="pTitle">Product</h1>
          <span class="show-tag" id="pTag"></span>
          <p class="pdp-blurb" id="pDesc"></p>
          <p class="pdp-more">Voor specificaties, onderhoud of een demo kunt u contact opnemen. Prijzen zijn zichtbaar na inloggen.</p>
          <div class="pdp-actions">
            <a class="btn orange" href="afspraak.html">Afspraak maken</a>
            <a class="btn ghost" href="support.html">Support</a>
          </div>
        </div>
      </article>

      <section class="pdp-related">
        <h2>Meer in deze categorie</h2>
        <div class="showcase" id="related"></div>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/site.js"></script>
  <script>
    pageInit = function () {
      const id = new URLSearchParams(location.search).get("id") || PRODUCTS[0].id;
      const p = PRODUCTS.find((x) => x.id === id) || PRODUCTS[0];
      const meta = CATS[p.cat] || CATS.all;
      document.title = p.name + " | sgdentalshop.com";
      document.getElementById("pTitle").textContent = p.name;
      document.getElementById("crumbName").textContent = p.name;
      document.getElementById("pBrand").textContent = p.brand;
      document.getElementById("pTag").textContent = p.tag;
      document.getElementById("pDesc").textContent = p.blurb || p.tag;
      const crumb = document.getElementById("crumbCat");
      crumb.textContent = meta.title;
      crumb.href = "categorie.html?cat=" + p.cat;
      fillProductVisual(document.getElementById("pVisual"), p);
      const related = PRODUCTS.filter((x) => x.cat === p.cat && x.id !== p.id);
      renderShowcase(document.getElementById("related"), related.length ? related : PRODUCTS.filter((x) => x.id !== p.id).slice(0, 4));
    };
  </script>
</body>
</html>
