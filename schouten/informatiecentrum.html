<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Informatiecentrum | sgdentalshop.com mockup</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-header"></div>
  <main class="page">
    <div class="wrap">
      <div class="crumbs"><a href="index.html">Home</a> / Informatiecentrum</div>
      <h1>Het informatiecentrum</h1>
      <p class="lead">Heeft u een specifieke vraag? Bel met één van onze specialisten: <strong>+31 (0)186 603 600</strong></p>
      <div class="news-list" id="articles" style="margin-top:24px"></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/site.js"></script>
  <script>
    pageInit = function () {
      document.getElementById("articles").innerHTML = NEWS.map((title, i) => `
        <article class="news-item" style="grid-template-columns:1fr 140px;margin-bottom:16px;display:grid;gap:16px">
          <div>
            <h3 style="margin:0 0 6px;font-size:16px"><a href="artikel.html?id=${i+1}">${title}</a></h3>
            <p style="color:#666;font-size:13px;margin:0">Korte introductie placeholder voor blogartikel ${i + 1}.</p>
          </div>
          <div class="ph" style="min-height:90px;height:90px"><span class="ph-label">IMG</span></div>
        </article>`).join("");
    };
  </script>
</body>
</html>
