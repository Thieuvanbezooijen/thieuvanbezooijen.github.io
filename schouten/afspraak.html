<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Afspraak maken | sgdentalshop.com mockup</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-header"></div>
  <main class="page">
    <div class="wrap" style="max-width:560px">
      <h1>Afspraak maken</h1>
      <p class="lead">Plan een demo, showroombezoek of adviesgesprek (mockup).</p>
      <form class="form" onsubmit="event.preventDefault(); alert('Mockup: afspraak aangevraagd');">
        <input placeholder="Naam*" required />
        <input placeholder="Bedrijf*" required style="margin-top:10px;width:100%" />
        <input type="email" placeholder="E-mail*" required style="margin-top:10px;width:100%" />
        <input placeholder="Telefoon" style="margin-top:10px;width:100%" />
        <textarea placeholder="Waarvoor wilt u een afspraak?" style="margin-top:10px;width:100%"></textarea>
        <button class="btn orange" type="submit" style="margin-top:12px">Versturen</button>
      </form>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/site.js"></script>
</body>
</html>
